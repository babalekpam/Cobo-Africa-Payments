# Serves the web app and reverse-proxies the API. Terminate TLS in front of this container
# (cloud load balancer, Caddy, Traefik, or nginx with certificates) and forward to port 80.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API (including the participant gateway at /api/gateway/*). X-Forwarded-For is OVERWRITTEN with
    # the real peer address (never appended) because the API trusts exactly one proxy hop for its
    # per-client rate limits — a client-supplied header must not be able to spoof it.
    location /api/ {
        client_max_body_size 11m;            # KYC uploads are capped at 10 MB by the API
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Single-page app: unknown paths fall back to index.html; hashed assets are cacheable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
